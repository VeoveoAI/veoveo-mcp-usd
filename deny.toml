# cargo-deny 0.20 policy: dependency licenses, security advisories, bans and sources.

[graph]
all-features = true

[advisories]
# paste is unmaintained, with no vulnerability and no safe upgrade. It is a compile-time macro,
# reached only through bevy_image, image, exr and pulp.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "unmaintained, compile-time only, through Bevy's image stack" }]

[licenses]
# Licenses compatible with distributing an Apache-2.0 project. Add a license here only
# after reviewing it, and record crate-specific cases under `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# notify, through bevy_asset's file watcher: CC0-1.0 dedicates the code to the public domain.
exceptions = [{ crate = "notify", allow = ["CC0-1.0"] }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/mxpv/openusd"]

[sources.allow-org]
github = ["VeoveoAI"]
