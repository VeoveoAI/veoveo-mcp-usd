[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-usd"
publish = false

[workspace.dependencies]
tempfile = "=3.27.0"
# veoveo-core, pinned to one revision for every core crate.
veoveo-skills = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
veoveo-task = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "9be8fac678163aae5cc76b87987282f739d5c2bc" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration and the forwarded identity.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "18a6e8c5f8a69ca57a6e12f8b752203574efa231", default-features = false }
# Artifact's client, which stores a render's PNG. It pins this SDK revision, so the two move together.
veoveo-mcp-artifact = { git = "https://github.com/VeoveoAI/veoveo-mcp-artifact", rev = "3f264d0aad2cdde70065ec2dcb3b8b51720d9ad2", default-features = false }

# The App's look and its gallery.
veoveo-hub-ui = { git = "https://github.com/VeoveoAI/veoveo-hub-ui", rev = "3000d65eccdbcdf23feb94acff9264b6df7b20c2" }

# Rendering, without a window on the server and in a canvas in the viewer.
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "png",
    "hdr",
    "tonemapping_luts",
    "zstd_rust",
    "reflect_auto_register",
] }
anyhow = "=1.0.104"
# A rendered frame's thumbnails.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
axum = { version = "0.8.9", default-features = false }
bytes = "1.12.1"
futures = "0.3.34"
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.11.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "1e7caf018db7eb3bed2e81023e10fc0ce58af8a5" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "1.53.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# From bevy_openusd: its tests and renderer depend on these being optimized in dev builds.
[profile.dev.package.openusd]
opt-level = 3

[profile.dev.package.usd_bevy]
opt-level = 3

[profile.dev.package.bevy_mesh]
opt-level = 3

[profile.dev.package.bevy_mikktspace]
opt-level = 3

# The viewer's WASM, which every person downloads: small over fast to build.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
