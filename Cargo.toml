[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-usd"
publish = false

[workspace.dependencies]
tempfile = "=3.27.0"
# veoveo-core, pinned to one revision for every core crate.
veoveo-skills = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "a8dafe90206d1cadbb1d2de26304fe061a542ffd" }
veoveo-task = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "a8dafe90206d1cadbb1d2de26304fe061a542ffd" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "a8dafe90206d1cadbb1d2de26304fe061a542ffd" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration and the forwarded identity.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "886cb6ab8e32ad412caaf537cf4ba6b92e8e8409", default-features = false }
# Artifact's client, which stores a render's PNG. It pins this SDK revision, so the two move together.
veoveo-mcp-artifact = { git = "https://github.com/VeoveoAI/veoveo-mcp-artifact", rev = "ad23b0511068969c94513ad8ad2b8944c8904bb2", default-features = false }

# Rendering, without a window on the server and in a canvas in the viewer.
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "png",
    "hdr",
    "tonemapping_luts",
    "zstd_rust",
    "reflect_auto_register",
] }
anyhow = "=1.0.104"
axum = { version = "0.8.9", default-features = false }
bytes = "1.12.1"
futures = "0.3.34"
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.8.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "d45f7f5e43e910f818400ca702cc904c5682c213" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "1.53.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# From bevy_openusd: its tests and renderer depend on these being optimized in dev builds.
[profile.dev.package.openusd]
opt-level = 3

[profile.dev.package.usd_bevy]
opt-level = 3

[profile.dev.package.bevy_mesh]
opt-level = 3

[profile.dev.package.bevy_mikktspace]
opt-level = 3

# The viewer's WASM, which every person downloads: small over fast to build.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
