<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>USD viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e2430; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
<script type="module">
  import init from "./usd_viewer.js";
  // Bevy ends the start function with an exception so that the browser keeps the event loop.
  init().catch((error) => {
    const text = String(error);
    if (!text.includes("Using exceptions for control flow")) {
      parent.postMessage(JSON.stringify({ usdViewer: { state: "failed", error: text } }), "*");
    }
  });
</script>
</body>
</html>
