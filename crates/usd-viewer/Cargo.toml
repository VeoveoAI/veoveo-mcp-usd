[package]
name = "usd-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true
description = "The USD viewer: usd_bevy as WASM in a browser, on WebGPU."

[lints]
workspace = true

# Bevy's derive macros find it in this table alone, so it is here for every target.
[dependencies]
bevy.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["bevy_window", "bevy_winit", "webgpu"] }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["render", "default_fonts"] }
usd_bevy = { path = "../usd_bevy" }
openusd = { git = "https://github.com/mxpv/openusd", rev = "d10fa4c2838e1e18a5c4fb4aa47534f94fde8995" }
js-sys = "=0.3.106"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Location", "Performance", "Response", "UrlSearchParams", "Window"] }
