[package]
name = "veoveo-mcp-usd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The server's public types: item identities and names, resource addresses, tool
# requests and results and the permission vocabulary. No database or runtime dependency.
contract = [
    "dep:schemars",
    "dep:serde",
    "dep:thiserror",
    "dep:uuid",
    "dep:veoveo-hub-sdk",
    "dep:veoveo-types",
]
# The hosted server: MCP through the SDK, persistence in the `usd` schema and the
# binary.
server = [
    "contract",
    "render",
    "veoveo-hub-sdk/server",
    "dep:anyhow",
    "dep:clap",
    "dep:dotenvy",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "dep:tracing",
    "dep:url",
    "dep:veoveo-skills",
    "dep:veoveo-store",
]

# Rendering a USD stage to images on the GPU: the binary's `render` subcommand.
render = ["dep:anyhow", "dep:bevy", "dep:usd_bevy"]

[build-dependencies]
# Embeds the skills under skills/ at build time.
veoveo-skills = { workspace = true, features = ["build"] }

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-hub-sdk = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
bevy = { workspace = true, optional = true, features = ["multi_threaded", "bevy_window"] }
usd_bevy = { path = "../usd_bevy", optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-skills = { workspace = true, optional = true }
veoveo-store = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
veoveo-hub-sdk = { workspace = true, features = ["server", "testing"] }
# `database-conformance` holds the crate's queries and schema to core's database rules.
veoveo-fixtures = { workspace = true, features = ["store", "database-conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "veoveo-mcp-usd"
required-features = ["server"]

[[test]]
name = "database_conformance"
required-features = ["server"]

[[test]]
name = "items"
required-features = ["server"]

[[test]]
name = "mcp"
required-features = ["server"]

[[test]]
name = "sql_confinement"
required-features = ["server"]
